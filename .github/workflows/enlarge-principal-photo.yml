name: Perbesar Foto Kepala Sekolah

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  enlarge-photo:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.event.head_commit.message, 'Perbesar foto Kepala Sekolah applied') }}
    steps:
      - uses: actions/checkout@v4

      - name: Perbesar foto pada index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '.principal{background:linear-gradient(135deg,#075985,#0284c7);color:#fff}.principal p{color:#e0f2fe}'
          new = old + '.principal img{display:block;width:min(360px,100%);height:420px!important;object-fit:cover;object-position:center;margin:0 auto 26px;border-radius:24px;box-shadow:0 20px 50px rgba(15,23,42,.22)}@media(max-width:850px){.principal img{width:min(300px,100%);height:360px!important}}@media(max-width:560px){.principal img{width:min(250px,100%);height:310px!important}}'
          if '.principal img{display:block;width:min(360px,100%)' not in s:
              if old not in s:
                  raise SystemExit('CSS principal tidak ditemukan')
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Perbesar foto Kepala Sekolah applied"
          git push
