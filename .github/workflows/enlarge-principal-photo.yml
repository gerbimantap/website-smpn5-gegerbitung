name: Perbesar Foto Kepala Sekolah

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  enlarge-photo:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.event.head_commit.message, 'Perbaiki foto Kepala Sekolah applied') }}
    steps:
      - uses: actions/checkout@v4

      - name: Jadikan foto kotak tanpa background tambahan
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Aturan terakhir adalah yang menang karena muncul paling bawah.
          # Ubah contain menjadi cover agar foto benar-benar memenuhi kotak,
          # tanpa area biru/background kosong di dalam kotak.
          pattern = r'\.principal img\{display:block;width:min\(360px,100%\);height:360px!important;object-fit:contain!important;object-position:center;background:transparent;margin:0 auto 26px;border-radius:16px;box-shadow:0 18px 45px rgba\(15,23,42,.18\)\}'
          replacement = '.principal img{display:block;width:min(360px,100%);height:360px!important;object-fit:cover!important;object-position:center;background:transparent;margin:0 auto 26px;border-radius:16px;box-shadow:0 18px 45px rgba(15,23,42,.18)}'

          s2, n = re.subn(pattern, replacement, s, count=1)
          if n == 0:
              raise SystemExit('Aturan CSS foto Kepala Sekolah tidak ditemukan')

          # Pastikan versi mobile juga tetap kotak.
          s2 = re.sub(
              r'@media\(max-width:560px\)\{\.principal img\{width:min\(240px,100%\);height:300px\}\}',
              '@media(max-width:560px){.principal img{width:min(300px,100%);height:300px!important}}',
              s2,
              count=1
          )

          p.write_text(s2, encoding='utf-8')
          PY

      - name: Commit perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Perbaiki foto Kepala Sekolah applied"
          git push
