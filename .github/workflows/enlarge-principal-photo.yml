name: Kembalikan Foto Kepala Sekolah ke Awal

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore-photo:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.event.head_commit.message, 'Kembalikan foto Kepala Sekolah applied') }}
    steps:
      - uses: actions/checkout@v4

      - name: Kembalikan CSS foto ke kondisi awal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Hapus blok CSS tambahan yang terakhir disisipkan.
          s = re.sub(
              r'\s*/\* Foto Kepala Sekolah diperbesar \*/\s*\.principal img\{[^}]*\}\s*@media\(max-width:560px\)\{\.principal img\{[^}]*\}\}',
              '', s, count=1
          )

          # Hapus aturan pembesaran yang sebelumnya disisipkan langsung setelah .principal.
          s = re.sub(
              r'\.principal img\{display:block;width:min\(360px,100%\);height:420px!important;object-fit:cover;object-position:center;margin:0 auto 26px;border-radius:24px;box-shadow:0 20px 50px rgba\(15,23,42,.22\)\}@media\(max-width:850px\)\{\.principal img\{width:min\(300px,100%\);height:360px!important\}\}@media\(max-width:560px\)\{\.principal img\{width:min\(300px,100%\);height:300px!important\}\}',
              '', s, count=1
          )

          # Jika masih ada variasi aturan foto Kepala Sekolah dari percobaan sebelumnya,
          # hapus aturan .principal img yang tersisa agar kembali ke CSS awal.
          s = re.sub(
              r'\.principal img\{display:block;width:min\(360px,100%\);height:360px!important;object-fit:contain!important;object-position:center;background:transparent;margin:0 auto 26px;border-radius:16px;box-shadow:0 18px 45px rgba\(15,23,42,.18\)\}@media\(max-width:560px\)\{\.principal img\{width:min\(240px,100%\);height:300px\}\}',
              '', s, count=1
          )

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit pengembalian
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Kembalikan foto Kepala Sekolah applied"
          git push
