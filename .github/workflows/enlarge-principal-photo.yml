name: Perbesar Foto Kepala Sekolah

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  enlarge-photo:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.event.head_commit.message, 'Perbaiki foto Kepala Sekolah applied') }}
    steps:
      - uses: actions/checkout@v4

      - name: Jadikan foto kotak dengan background asli
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '.principal img{display:block;width:min(320px,100%);height:380px;object-fit:cover;object-position:center;margin:0 auto 24px;border-radius:22px;box-shadow:0 18px 45px rgba(15,23,42,.18)}'
          new = '.principal img{display:block;width:min(360px,100%);height:360px!important;object-fit:contain!important;object-position:center;background:transparent;margin:0 auto 26px;border-radius:16px;box-shadow:0 18px 45px rgba(15,23,42,.18)}'

          if old in s:
              s = s.replace(old, new, 1)
          else:
              old2 = '.principal img{display:block;width:min(360px,100%);height:420px!important;object-fit:cover;object-position:center;margin:0 auto 26px;border-radius:24px;box-shadow:0 20px 50px rgba(15,23,42,.22)}'
              new2 = '.principal img{display:block;width:min(360px,100%);height:360px!important;object-fit:contain!important;object-position:center;background:transparent;margin:0 auto 26px;border-radius:16px;box-shadow:0 18px 45px rgba(15,23,42,.18)}'
              if old2 in s:
                  s = s.replace(old2, new2, 1)
              elif '.principal img{display:block;width:min(360px,100%)' not in s:
                  raise SystemExit('CSS foto Kepala Sekolah tidak ditemukan')

          import re
          s = re.sub(r'@media\(max-width:560px\)\{\.principal img\{width:min\((?:240|250)px,100%\);height:(?:300|310)px(?:!important)?\}\}', '@media(max-width:560px){.principal img{width:min(300px,100%);height:300px!important}}', s, count=1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Perbaiki foto Kepala Sekolah applied"
          git push
