name: Perbesar Foto Kepala Sekolah

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-principal-photo:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'Perbesar foto Kepala Sekolah otomatis') }}
    steps:
      - uses: actions/checkout@v4

      - name: Tambahkan CSS foto Kepala Sekolah
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = '''\n    /* Foto Kepala Sekolah diperbesar */\n    .principal img{display:block;width:min(320px,100%);height:380px;object-fit:cover;object-position:center;margin:0 auto 24px;border-radius:22px;box-shadow:0 18px 45px rgba(15,23,42,.18)}\n    @media(max-width:560px){.principal img{width:min(240px,100%);height:300px}}\n'''

          if '/* Foto Kepala Sekolah diperbesar */' not in s:
              s = s.replace('</style>', css + '  </style>', 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Perbesar foto Kepala Sekolah otomatis"
          git push
