name: Generate Share Pages

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate static share pages from Supabase
        env:
          SUPABASE_URL: https://ekkwsbvvfvybreyclmhq.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/generate-share-pages.mjs

      - name: Commit generated pages when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add share
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan halaman share."
          else
            git commit -m "chore: update share pages from Supabase"
            git push
          fi
