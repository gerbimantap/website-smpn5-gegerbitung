name: Aktifkan Transisi Halaman Website

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  enable-transition:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tambahkan script transisi halaman
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '<script src="./page-transition.js"></script>'
          if marker not in text:
              text = text.replace('</head>', f'  {marker}\n</head>', 1)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Commit perubahan
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
          else
            git commit -m "Aktifkan full screen page transition"
            git push
          fi
