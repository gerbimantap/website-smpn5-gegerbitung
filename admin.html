<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin • SMPN 5 Gegerbitung</title>
<link rel="icon" href="assets/logo-smpn5-gegerbitung.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500,600,700,800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#0284c7;--soft:#e0f2fe;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f8fafc}*{box-sizing:border-box}body{margin:0;font-family:Inter,sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#e0f2fe,#fff)}.login-card{width:min(430px,100%);background:#fff;padding:35px;border:1px solid var(--line);border-radius:25px;box-shadow:0 25px 70px #0f172a12}.logo{display:block;width:90px;height:90px;object-fit:contain;margin:auto}.login h1{text-align:center;font-family:"Plus Jakarta Sans";font-size:25px}.muted{color:var(--muted);font-size:13px;line-height:1.7}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:12px;font-weight:700}.field input,.field textarea,.field select{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:10px;outline:none;background:#fff}.field textarea{min-height:110px;resize:vertical}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:var(--p);color:#fff}.ghost{background:#fff;border:1px solid var(--line)}.error{color:#b91c1c;background:#fee2e2;padding:10px;border-radius:10px;font-size:12px}.app{display:none;min-height:100vh}.sidebar{position:fixed;left:0;top:0;bottom:0;width:245px;background:#075985;color:#e0f2fe;padding:20px 15px;overflow:auto}.side-brand{display:flex;align-items:center;gap:9px;color:#fff;font-weight:800;margin-bottom:25px}.side-brand img{width:43px;height:43px;object-fit:contain;background:#fff;border-radius:10px}.menu{display:grid;gap:4px}.menu button{background:transparent;color:#bae6fd;border:0;text-align:left;padding:11px 12px;border-radius:9px;cursor:pointer;font-weight:600;font-size:13px}.menu button:hover,.menu button.active{background:#0369a1;color:#fff}.main{margin-left:245px;padding:25px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:25px}.top h1{font-family:"Plus Jakarta Sans";margin:0;font-size:26px}.user{font-size:12px;color:var(--muted)}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:20px}.panel h2{margin:0 0 15px;font-size:18px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table th{background:#f8fafc}.actions{display:flex;gap:6px;flex-wrap:wrap}.small{padding:7px 9px;font-size:11px}.dashboard-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.dash-card{background:#fff;border:1px solid var(--line);padding:20px;border-radius:15px}.dash-card b{font-size:27px;display:block;color:var(--p)}.dash-card span{font-size:12px;color:var(--muted)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#0f172a88;display:grid;place-items:center;padding:20px;z-index:50}.modal-card{width:min(760px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h2{margin:0}.toast{position:fixed;right:20px;bottom:20px;background:#0f172a;color:#fff;padding:12px 15px;border-radius:10px;font-size:12px;display:none;z-index:60}
@media(max-width:900px){.sidebar{width:205px}.main{margin-left:205px}.dashboard-cards{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}@media(max-width:650px){.sidebar{position:static;width:auto}.app{display:block}.main{margin-left:0;padding:15px}.dashboard-cards{grid-template-columns:1fr 1fr}.top{display:block}.top .actions{margin-top:10px}.sidebar{height:auto}.menu{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="login" class="login"><div class="login-card">
<img class="logo" src="assets/logo-smpn5-gegerbitung.png"><h1>Admin SMPN 5 Gegerbitung</h1><p class="muted" style="text-align:center">Masuk untuk mengelola seluruh konten website.</p>
<div id="loginError" class="error hidden"></div>
<div class="field"><label>Email</label><input id="email" type="email" placeholder="email admin"></div>
<div class="field"><label>Password</label><input id="password" type="password" placeholder="password"></div>
<button class="btn primary" style="width:100%" id="loginBtn">Masuk</button>
<p class="muted">Akun dibuat di Supabase Authentication. Jangan membagikan password atau service role key.</p>
</div></div>

<div id="app" class="app">
<aside class="sidebar"><div class="side-brand"><img src="assets/logo-smpn5-gegerbitung.png"><span>SMPN 5<br>Gegerbitung</span></div>
<div class="menu" id="menu"></div><button id="logout" class="btn" style="width:100%;margin-top:20px;background:#0c4a6e;color:#fff">Keluar</button></aside>
<main class="main"><div class="top"><div><h1 id="pageTitle">Dashboard</h1><div class="user" id="userInfo"></div></div><div class="actions"><a class="btn ghost" href="/" target="_blank">Lihat Website</a></div></div><div id="content"></div></main>
</div>
<div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle"></h2><button class="btn ghost" id="closeModal">Tutup</button></div><div id="modalBody"></div></div></div>
<div id="toast" class="toast"></div>
<script type="module" src="admin.js"></script>
</body></html>
